name: ci

# Lint, test, build and validate. Needs no cloud credentials, so it is safe on
# every push and pull request. cd.yml calls it before deploying.
on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Unit tests
        run: python -m unittest discover -s tests -v

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (not pushed)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: hello-devops:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run container and probe it
        run: |
          docker run -d --name app -p 8080:8080 hello-devops:ci
          for i in $(seq 1 20); do curl -sf localhost:8080/livez >/dev/null && break; sleep 1; done
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8080/healthz)" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8080/readyz)" = 200
          test "$(docker exec app id -u)" != 0
          docker logs app

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.5
      - name: fmt
        run: terraform fmt -check -recursive infra
      - name: validate (main stack, no backend/credentials)
        working-directory: infra
        run: |
          terraform init -backend=false -input=false
          terraform validate
      - name: validate (bootstrap stack)
        working-directory: infra/bootstrap
        run: |
          terraform init -backend=false -input=false
          terraform validate
